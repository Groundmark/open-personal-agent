<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4EEE2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14181F" media="(prefers-color-scheme: dark)">
<title>Your agent</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header><span class="mark" aria-hidden="true"></span><h1>Your agent</h1><button id="password" type="button" class="link" hidden>Password</button><button id="signout" type="button" class="link" hidden>Sign out</button></header>
<div id="notify-bar" hidden><span id="notify-text">Get a notification when your agent needs you.</span><button id="notify" type="button">Turn on</button></div>
<main id="log" aria-live="polite"></main>
<section id="signin" hidden>
  <button id="signin-go" type="button">Sign in with your passkey</button>
  <form id="pw-form" hidden>
    <p class="or">or with your password</p>
    <div class="pw"><input id="pw" type="password" autocomplete="current-password" aria-label="Password" placeholder="Password" required>
      <button type="button" class="eye" aria-label="Show password" data-for="pw"></button></div>
    <button type="submit">Sign in</button>
  </form>
  <p id="signin-status" role="status"></p>
</section>
<dialog id="pw-dialog">
  <form id="set-pw" method="dialog">
    <h2>Set a password</h2>
    <p>For signing in on a computer without your passkey. Approvals still use your passkey.</p>
    <div class="pw"><input id="new-pw" type="password" autocomplete="new-password" aria-label="New password" placeholder="At least 12 characters" minlength="12" required>
      <button type="button" class="eye" aria-label="Show password" data-for="new-pw"></button></div>
    <p id="set-pw-status" role="status"></p>
    <div class="row"><button type="submit" class="approve">Save</button><button type="button" id="set-pw-cancel" class="decline">Cancel</button></div>
  </form>
</dialog>
<form id="composer" hidden>
  <textarea id="text" rows="1" placeholder="Message your agent" aria-label="Message" maxlength="4000"></textarea>
  <button id="send" type="submit" aria-label="Send">↑</button>
</form>
<script src="/app.js"></script>
</body>
</html>
